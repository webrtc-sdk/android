name: Publish

on:
  push:
    # only publish on version tags
    tags:
      - v*
  # Called by release.yml after it created the v<version> release.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to publish'
        type: string
        required: true

jobs:
  # Forks and test copies have no signing/Nexus secrets: skip instead of
  # failing, and never publish from them.
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
    - id: check
      env:
        NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
        SIGNING_KEY_ARMOR: ${{ secrets.SIGNING_KEY_ARMOR }}
      run: |
        if [ -n "$NEXUS_USERNAME" ] && [ -n "$SIGNING_KEY_ARMOR" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Nexus/signing secrets not set; skipping Maven publish"
        fi

  publish:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        path: ./android
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive

    # Gradle 9.x requires JVM 17 or later to run.
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download aars
      run: |
        ./downloadAar.sh
        ./downloadAar_prefixed.sh
        ./downloadAar_prefixed_stripped.sh

    - name: Check required files exist
      run: |
        test -f "android/libwebrtc.aar"
        test -f "android-prefixed/shadow/libs/classes.jar"
        test -f "android-prefixed/src/main/jniLibs/arm64-v8a/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed/src/main/jniLibs/armeabi-v7a/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed/src/main/jniLibs/x86/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed/src/main/jniLibs/x86_64/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed-stripped/shadow/libs/classes.jar"
        test -f "android-prefixed-stripped/src/main/jniLibs/arm64-v8a/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed-stripped/src/main/jniLibs/armeabi-v7a/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed-stripped/src/main/jniLibs/x86/liblkjingle_peerconnection_so.so"
        test -f "android-prefixed-stripped/src/main/jniLibs/x86_64/liblkjingle_peerconnection_so.so"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create gpg key and import into gradle properties
      run: |
        echo $GPG_KEY_ARMOR | base64 --decode > ./release.asc
        gpg --quiet --output $GITHUB_WORKSPACE/release.gpg --dearmor ./release.asc
        sed -i -e "s,nexusUsername=,nexusUsername=$NEXUS_USERNAME,g" gradle.properties
        sed -i -e "s,nexusPassword=,nexusPassword=$NEXUS_PASSWORD,g" gradle.properties
        sed -i -e "s,signing.keyId=,signing.keyId=$GPG_KEY_ID,g" gradle.properties
        sed -i -e "s,signing.password=,signing.password=$GPG_PASSWORD,g" gradle.properties
        sed -i -e "s,signing.secretKeyRingFile=,signing.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg,g" gradle.properties
        sed -i -e "s,STAGING_PROFILE_ID=,STAGING_PROFILE_ID=$STAGING_PROFILE_ID,g" gradle.properties
      env:
        GPG_KEY_ARMOR: ${{ secrets.SIGNING_KEY_ARMOR }}
        GPG_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        GPG_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        STAGING_PROFILE_ID: ${{ secrets.STAGING_PROFILE_ID }}

    - name: Assemble
      run: ./gradlew assemble

    - name: Publish to sonatype
      run: ./gradlew publishAllPublicationsToMavenRepository closeAndReleaseMavenStagingRepository -Dorg.gradle.parallel=false